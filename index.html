<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VK's Portfolio</title>
    <style>
      /* Eliminate white flash: set background BEFORE any JS loads */
      html, body {
        margin: 0;
        padding: 0;
        background: #030303;
        color: #e0e0e0;
      }
      /* Loading spinner shown inside #root until React mounts */
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #030303;
        z-index: 99999;
      }
      #app-loader .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #1a1a1a;
        border-top-color: #00ff00;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      #app-loader .loader-text {
        margin-top: 16px;
        font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
        font-size: 12px;
        color: #00ff00;
        letter-spacing: 2px;
        text-transform: uppercase;
        opacity: 0.7;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="module" crossorigin src="/prt-VK/assets/index-CI77K8tv.js"></script>
    <link rel="stylesheet" crossorigin href="/prt-VK/assets/index-CZyYGGj8.css">
  </head>
  <body>
    <div id="root">
      <!-- This loader is shown instantly while React JS loads -->
      <div id="app-loader">
        <div class="spinner"></div>
        <div class="loader-text">Loading</div>
      </div>
    </div>
  </body>
</html>
